name: Sync from HackMD

# Once a day, pull every HackMD note in scripts/sources.json and commit any new
# (or changed, still-draft) writeups as hidden drafts marked `pending: true`.
# Drafts aren't built, so this never changes the live site by itself; pending
# drafts are reviewed and published separately (by hand or by the Claude task).
on:
  schedule:
    - cron: '0 18 * * *' # 02:00 in Taiwan (UTC+8)
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: hackmd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Commit new drafts
        run: |
          if [ -z "$(git status --porcelain src/content)" ]; then
            echo "Nothing new from HackMD."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          git commit -m "Sync new writeups from HackMD as drafts"
          git push
